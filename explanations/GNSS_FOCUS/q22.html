      <h1>GNSS測位 No.22 解説</h1>
      
        <p><strong>正解は 3 です。</strong></p>
        <p>斜面や樹木は遮蔽や反射の原因になり、FIX表示だけでは成果の妥当性を判断できない。観測条件を記録し、再観測差や既知点確認で採否を判断する。必要に応じてTSなど別手法を併用する。</p>
        <h2>実務で見るポイント</h2>
        <p>斜面・樹木下では、GNSSで取る点と別手法で補完する点を現場で切り分ける。</p>
