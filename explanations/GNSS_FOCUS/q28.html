      <h1>GNSS測位 No.28 解説</h1>
      
        <p><strong>正解は 3 です。</strong></p>
        <p>衛星数だけでなく、PDOP、再観測差、上空視界を合わせて判断する。この例では、2回目の方が衛星数は少ないがPDOPと再観測差が改善しており、観測条件の改善を記録した上で採用候補とできる。</p>
        <h2>実務で見るポイント</h2>
        <p>衛星数が多いことだけを採用理由にせず、PDOPと再観測差をセットで評価する。</p>
