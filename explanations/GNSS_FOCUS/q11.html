      <h1>GNSS測位 No.11 解説</h1>
      
        <p><strong>正解は 2 です。</strong></p>
        <p>FIX表示や受信機の水平精度表示だけで成果を採用してはいけない。既知点成果との差が0.18 mと大きく、周辺に金属柵や水面があるため、マルチパス、座標系の誤り、既知点成果の取り違え、観測条件の不足を疑う。実務では、再観測、観測点周辺の確認、既知点成果・座標系の確認、TS等による検証を行う。</p>
        <h2>実務で見るポイント</h2>
        <p>FIXは必ず正しいことを意味しない。既知点との検測差、周辺写真、観測メモを残して総合的に判断する。</p>
