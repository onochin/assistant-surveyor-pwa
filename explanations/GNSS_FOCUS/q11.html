      <h1>GNSS測位 No.11 解説</h1>
      
        <p><strong>正解は 2 です。</strong></p>
        <p>GNSSはGlobal Navigation Satellite Systemの総称で、GPSだけでなく準天頂衛星システムなども含めて扱う。測量では、衛星からの信号を用いるが、時計誤差や高さの扱いを正しく理解する必要がある。</p>
        <h2>実務で見るポイント</h2>
        <p>受信機の表示値をそのまま採用せず、利用している衛星系、測位方式、座標系、高さの基準を確認する。</p>
