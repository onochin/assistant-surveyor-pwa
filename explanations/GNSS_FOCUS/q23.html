      <h1>GNSS測位 No.23 解説</h1>
      
        <p><strong>正解は 2 です。</strong></p>
        <p>GISや点群との重ね合わせでは、座標値だけでなく座標系、系番号、測地系、高さの基準、単位が必要である。観測方法や精度確認結果も渡すことで、後工程でずれの原因を追跡しやすくなる。</p>
        <h2>実務で見るポイント</h2>
        <p>座標CSVを渡すときは、座標値とメタデータをセットで渡す。</p>
