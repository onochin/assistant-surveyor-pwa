      <h1>GNSS測位 No.19 解説</h1>
      
        <p><strong>正解は 2 です。</strong></p>
        <p>PDOPは衛星配置の幾何学的な条件を評価する指標である。衛星数が多くても、配置が偏ると精度が安定しないことがある。現場ではPDOP、上空視界、再観測差を合わせて確認する。</p>
        <h2>実務で見るポイント</h2>
        <p>衛星数だけで安心せず、PDOPと遮蔽方向を観測メモに残す。</p>
