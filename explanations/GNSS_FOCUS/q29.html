      <h1>GNSS測位 No.29 解説</h1>
      
        <p><strong>正解は 1 です。</strong></p>
        <p>測量成果には基準となる時点があり、GNSS観測は観測した時点の地殻変動の影響を受ける。セミ・ダイナミック補正は、観測時点と成果の基準時点を整合させるための考え方である。</p>
        <h2>実務で見るポイント</h2>
        <p>電子基準点成果、観測時点、成果として扱う時点を混同しない。</p>
