      <h1>GNSS測位 No.30 解説</h1>
      
        <p><strong>正解は 4 です。</strong></p>
        <p>精度管理表では、FIX表示だけでなく、PDOP、再観測差、既知点差・検測差、周辺状況を合わせて採否を判断する。P2はPDOPが大きく樹木の影響が疑われ、P3は再観測差と検測差が大きく水面・金属柵の影響が疑われるため、採用前の確認が必要である。</p>
        <h2>実務で見るポイント</h2>
        <p>精度管理表は採用済みの記録ではなく、成果採否を説明するための判断材料として使う。</p>
