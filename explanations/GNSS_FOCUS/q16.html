      <h1>GNSS測位 No.16 解説</h1>
      
        <p><strong>正解は 2 です。</strong></p>
        <p>複数の衛星系を利用できることは有利だが、谷地形や樹木による遮蔽、通信不良の影響がなくなるわけではない。観測時間帯や衛星配置、補正情報の取得状態を確認し、必要に応じて観測条件を変える。GISや点群に重ねる場合も、座標系と高さの基準を確認する必要がある。</p>
        <h2>実務で見るポイント</h2>
        <p>みちびきを使えることと、成果を無条件に採用できることは別。遮蔽、通信状態、座標系、高さを確認する。</p>
