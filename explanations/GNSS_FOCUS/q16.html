      <h1>GNSS測位 No.16 解説</h1>
      
        <p><strong>正解は 2 です。</strong></p>
        <p>みちびきは日本周辺で衛星測位を補完・補強するシステムで、GNSSを学ぶうえでGPSとあわせて理解したい。</p>
        <h2>実務で見るポイント</h2>
        <p>測位性能を評価するときは、どの衛星系と補強情報を使っているかを受信機設定やログで確認する。</p>
