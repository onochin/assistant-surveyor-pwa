      <h1>GNSS測位 No.21 解説</h1>
      
        <p><strong>正解は 1 です。</strong></p>
        <p>電子基準点はGNSS測量の基準として重要だが、現場側の受信環境、補正情報の取得状態、通信状況、座標系設定が不適切であれば成果は不安定になる。基準と現場条件を分けて確認する。</p>
        <h2>実務で見るポイント</h2>
        <p>電子基準点を使っていることと、現場成果が無条件に正しいことは別である。</p>
