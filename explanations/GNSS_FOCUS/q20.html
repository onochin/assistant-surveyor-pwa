      <h1>GNSS測位 No.20 解説</h1>
      
        <p><strong>正解は 4 です。</strong></p>
        <p>平面直角座標系は日本国内で複数の系に分かれている。系番号を誤ると、GISやCAD、点群との重ね合わせで大きなずれになる。成果を渡すときは、座標系、系番号、測地系を明記する。</p>
        <h2>実務で見るポイント</h2>
        <p>座標値だけでなく、座標系名と系番号をセットで扱う。</p>
