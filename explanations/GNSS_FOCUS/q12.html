      <h1>GNSS測位 No.12 解説</h1>
      
        <p><strong>正解は 1 です。</strong></p>
        <p>電離圏遅延は衛星測位の代表的な誤差要因で、周波数により影響量が異なる。この性質を利用して、2周波観測では電離圏の影響を推定・軽減できる。</p>
