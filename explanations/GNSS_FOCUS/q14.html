      <h1>GNSS測位 No.14 解説</h1>
      
        <p><strong>正解は 2 です。</strong></p>
        <p>電子基準点は全国に設置されたGNSS連続観測点で、国家座標に整合する位置の基準として扱われる。観測データは測量だけでなく地殻変動の監視にも利用される。</p>
        <h2>実務で見るポイント</h2>
        <p>既知点として使う場合は、成果の時点、停止・改定情報、近傍点との整合を確認する。</p>
