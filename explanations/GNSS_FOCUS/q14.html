      <h1>GNSS測位 No.14 解説</h1>
      
        <p><strong>正解は 2 です。</strong></p>
        <p>既知点成果との差がある場合、GNSS観測の誤差だけでなく、座標系の誤り、既知点成果の時点、点名の取り違え、高さの基準、ジオイドモデルの扱いなどを確認する必要がある。特に座標系の境界付近では、使用する平面直角座標系を誤ると大きなずれにつながる。</p>
        <h2>実務で見るポイント</h2>
        <p>既知点成果、点名、点番号、座標系、水平位置と高さを別々に確認する。</p>
