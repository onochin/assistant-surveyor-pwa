      <h1>GNSS測位 No.13 解説</h1>
      
        <p><strong>正解は 1 です。</strong></p>
        <p>マルチパスは直接波に加えて反射波を受信することで生じる。建物、金属面、水面などの反射しやすい環境を避けることが重要である。</p>
