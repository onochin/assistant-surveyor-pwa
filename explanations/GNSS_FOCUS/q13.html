      <h1>GNSS測位 No.13 解説</h1>
      
        <p><strong>正解は 2 です。</strong></p>
        <p>マルチパスは、衛星からの電波が周辺物体で反射して受信されることで生じる。水面、金属、橋梁、建物などは反射源になりやすい。FIX表示であっても、同一点の再観測差が大きい場合は成果として採用せず、再観測や別手法による確認を行う。</p>
        <h2>実務で見るポイント</h2>
        <p>FIX表示だけで採否を決めず、反射しやすい水面、金属、橋梁を観測メモに残す。</p>
