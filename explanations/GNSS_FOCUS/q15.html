      <h1>GNSS測位 No.15 解説</h1>
      
        <p><strong>正解は 2 です。</strong></p>
        <p>ネットワーク型RTKでは、FIX/FLOAT、衛星数、PDOP、補正情報の安定性、観測時間、再観測差を総合的に判断する。この例では、2回目がFLOATで、補正情報も不安定、PDOPも大きめである。成果として採用する前に、再観測や観測条件の改善、別手法による確認が必要である。</p>
        <h2>実務で見るポイント</h2>
        <p>FIX/FLOATだけでなく、PDOP、補正情報、再観測差、周辺状況を合わせて成果採否を説明する。</p>
