      <h1>GNSS測位 No.25 解説</h1>
      
        <p><strong>正解は 2 です。</strong></p>
        <p>ネットワーク型RTKでは補正情報の安定性が重要である。最終的にFIXへ戻っても、途中の通信途切れやFLOAT化、再観測差が成果に影響する場合がある。採用前に記録と検測で確認する。</p>
        <h2>実務で見るポイント</h2>
        <p>通信途切れは現場メモに残し、後で成果採否を説明できるようにする。</p>
