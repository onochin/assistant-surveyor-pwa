      <h1>GNSS測位 No.24 解説</h1>
      
        <p><strong>正解は 4 です。</strong></p>
        <p>既知点確認で差が出た場合は、一つの原因に決めつけず、点名・座標系・成果時点・高さ基準・ジオイド・観測条件・周辺環境を順に確認する。水平差が小さく見えても、高さ差や再観測差が説明できない場合は成果採用に注意が必要である。</p>
        <h2>実務で見るポイント</h2>
        <p>差が出たときは、観測ミス、設定ミス、成果の前提、現場環境を分けて確認する。</p>
