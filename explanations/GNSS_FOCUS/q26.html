      <h1>GNSS測位 No.26 解説</h1>
      
        <p><strong>正解は 3 です。</strong></p>
        <p>UAV写真測量やLiDAR点群では、標定点の座標と高さの基準が処理結果全体へ影響する。後工程で調整できる場合でも、現場での座標系、点名、高さ基準、精度確認を記録しておく必要がある。</p>
        <h2>実務で見るポイント</h2>
        <p>標定点は現場と後処理をつなぐ基準点として扱い、点名と座標基準を崩さない。</p>
