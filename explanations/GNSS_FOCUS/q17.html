      <h1>GNSS測位 No.17 解説</h1>
      
        <p><strong>正解は 2 です。</strong></p>
        <p>GNSS測量では高さの基準を混同しないことが重要である。GNSSで扱う楕円体高を、そのまま標高として扱うと、成果や点群の高さがずれる。標高として使う場合はジオイド高や使用したジオイドモデルを確認する。</p>
        <h2>実務で見るポイント</h2>
        <p>現地調査で高さを渡すときは、楕円体高なのか標高なのかを必ず明記する。</p>
