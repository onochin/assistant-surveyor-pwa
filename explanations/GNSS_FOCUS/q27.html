      <h1>GNSS測位 No.27 解説</h1>
      
        <p><strong>正解は 2 です。</strong></p>
        <p>標高は、楕円体高からジオイド高を差し引いて求める。この例では 52.34 m - 38.27 m = 14.07 m である。符号を誤ると高さが大きくずれるため、式と使用したジオイド高を確認する。</p>
        <h2>実務で見るポイント</h2>
        <p>高さ計算では、式だけでなく、楕円体高・ジオイド高・標高のどれを記録しているかを確認する。</p>
