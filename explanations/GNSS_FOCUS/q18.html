      <h1>GNSS測位 No.18 解説</h1>
      
        <p><strong>正解は 3 です。</strong></p>
        <p>FIXは良好な条件を示す重要な情報だが、必ず正しい成果であることまでは保証しない。現場では既知点確認、再観測差、周辺環境、補正情報の安定性を合わせて判断する。</p>
        <h2>実務で見るポイント</h2>
        <p>測位状態は採否判断の一部であり、単独の合格印ではない。</p>
