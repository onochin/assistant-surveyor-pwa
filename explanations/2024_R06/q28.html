      <h1>No. 28 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 2 です。</strong></p>
<p>水準基標は、水位標に近接した位置に設置します。設置間隔の標準は5 kmから20 kmまでです。</p>
<p>1 kmから2 kmまでとする選択肢2が誤りです。定期横断測量、深浅測量、法線測量についての他の記述は適切です。</p>
