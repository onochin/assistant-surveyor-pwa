      <h1>No. 2 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 4（c、d） です。</strong></p>
<p>貸与データと現地作業の管理に関する問題です。</p>
<dl><dt>c. 誤り</dt><dd>Aから貸与された成果を、無断でBの業務に流用してはいけません。成果の管理と目的外利用の防止が必要です。</dd>
<dt>d. 誤り</dt><dd>樹木の伐採は所有者の承諾を得てから行います。作業後の連絡では足りません。</dd>
<dt>a、b、e. 正しい</dt><dd>安全管理、事故時の速やかな報告、身分証明書の携帯として適切です。</dd></dl>
