      <h1>No. 24 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 2 です。</strong></p>
<p>基盤地図情報には、行政区画の境界線及び代表点が含まれます。</p>
<p>行政区画の境界線のような無形線を含まないとする選択肢2が誤りです。基盤地図情報は電子地図上の位置の基準として利用できます。</p>
