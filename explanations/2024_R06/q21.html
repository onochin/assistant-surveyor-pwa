      <h1>No. 21 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 4 です。</strong></p>
<p>図中の税務署と保健所の経緯度を基準にし、裁判所の位置を内挿します。</p>
<p>裁判所は、図上で税務署・保健所との位置関係を比較すると、北緯26°12′31″、東経127°41′11″付近です。</p>
