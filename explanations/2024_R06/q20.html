      <h1>No. 20 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 5 です。</strong></p>
<p>UAVレーザ測量で対地高度を高くすると、同じ計測諸元では地上の計測点間隔は大きくなります。</p>
<p>選択肢5は「小さくなる」としているため誤りです。運航に関する法令遵守、写真からの点群作成、市販デジタルカメラの利用条件に関する他の記述は適切です。</p>
