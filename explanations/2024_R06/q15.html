      <h1>No. 15 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 3 です。</strong></p>
<p>まずAB間の標高差と水平距離を求め、標高45 mまでの割合を使います。</p>
<p class="calculation">ABの標高差 = 50 sin 6° ≒ 5.23 m<br>
ABの水平距離 = 50 cos 6° ≒ 49.73 m<br>
必要な標高差 = 45.0 - 40.8 = 4.2 m<br>
49.73 × 4.2 ÷ 5.23 ≒ 40 m</p>
<p>縮尺1/1,000では40 mは4.0 cmです。</p>
