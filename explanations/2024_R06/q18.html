      <h1>No. 18 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 1 です。</strong></p>
<p>撮影基準面からの対地高度は、3,000 - 600 = 2,400 mです。</p>
<p class="calculation">短辺の撮像面長 = 10,000 × 5 μm = 0.05 m<br>
短辺の地上長 = 2,400 × 0.05 ÷ 0.12 = 1,000 m<br>
撮影基線長 = 1,000 × (1 - 0.60) = 400 m</p>
