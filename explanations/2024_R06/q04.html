      <h1>No. 4 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 1（a、c） です。</strong></p>
<dl><dt>a. 誤り</dt><dd>地心直交座標から得られる楕円体高を標高へ直すには、ジオイド高が必要です。</dd>
<dt>c. 誤り</dt><dd>ジオイドは重力の方向と直交しますが、地球表面に対して一様に平行ではありません。</dd>
<dt>b、d、e. 正しい</dt><dd>標高、回転楕円体、標高 = 楕円体高 - ジオイド高の関係として適切です。</dd></dl>
