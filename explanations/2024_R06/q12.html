      <h1>No. 12 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 2 です。</strong></p>
<p>標尺改正数と温度差による伸縮を加えます。</p>
<p class="calculation">温度差 = 28 - 20 = 8 ℃<br>
補正係数 = 10 × 10<sup>-6</sup> + 1.5 × 10<sup>-6</sup> × 8 = 22 × 10<sup>-6</sup><br>
補正量 = -50.0000 × 22 × 10<sup>-6</sup> = -0.0011 m<br>
補正後 = -50.0011 m</p>
