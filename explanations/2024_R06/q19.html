      <h1>No. 19 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 2 です。</strong></p>
<p>航空レーザ測量の欠測率を計算するとき、水部は計算対象に含めません。</p>
<p class="calculation">格子数 = 800 × 600 = 480,000<br>
欠測率 = 36,000 ÷ 480,000 × 100 = 7.5 %</p>
