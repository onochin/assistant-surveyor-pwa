      <h1>No. 10 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 3 です。</strong></p>
<p>1回のレベル設置で前へ進める距離は、後視45 mと前視45 mを合わせた最大90 mです。</p>
<p class="calculation">1,700 ÷ 90 ≒ 18.9</p>
<p>最低19点が必要ですが、1級水準測量では測点数を偶数にするため、最低20点です。</p>
