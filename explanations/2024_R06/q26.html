      <h1>No. 26 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 3 です。</strong></p>
<p>円曲線の接線長と曲線長を求めます。</p>
<p class="calculation">接線長 = R tan(I ÷ 2) = 200 tan 30° ≒ 115.5 m<br>
BP〜BC = 280 - 115.5 = 164.5 m<br>
曲線長 = 200 × 3.14 × 60 ÷ 180 ≒ 209.3 m<br>
路線長 = 164.5 + 209.3 + 206 ≒ 580 m</p>
