      <h1>No. 17 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 3（b、d） です。</strong></p>
<dl><dt>b. 誤り</dt><dd>他の条件が同じなら、撮影高度が高いほど地上画素寸法は大きくなります。</dd>
<dt>d. 誤り</dt><dd>中心投影では、高い地物は鉛直点から外側へ倒れ込んだように写ります。</dd>
<dt>a、c、e. 正しい</dt><dd>中心投影像と地上画素寸法の性質を正しく示しています。</dd></dl>
