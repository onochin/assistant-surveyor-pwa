      <h1>No. 6 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 4 です。</strong></p>
<p>方向角はX軸の正方向から時計回りに測ります。</p>
<p class="calculation">ΔX = 1,000 cos 305° ≒ +573.58 m<br>
ΔY = 1,000 sin 305° ≒ -819.15 m<br>
XB = -800.00 + 573.58 = -226.42 m<br>
YB = +1,100.00 - 819.15 = +280.85 m</p>
