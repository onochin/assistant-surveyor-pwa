      <h1>No. 22 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 5 です。</strong></p>
<p>国土地理院の「500万分1日本とその周辺」は、東京を中心とする正距方位図法による地図です。</p>
<p>地図主点からの方位と距離を正しく表す性質は正距方位図法の特徴です。ガウス・クリューゲル図法とする選択肢5が誤りです。</p>
