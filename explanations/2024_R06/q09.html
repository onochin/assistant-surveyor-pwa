      <h1>No. 9 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 5 です。</strong></p>
<p>2周波観測で軽減できる代表的なものは、周波数に依存する電離層遅延です。</p>
<p>対流圏遅延は電離層遅延と性質が異なるため、「2周波で基線解析を行えば対流圏の影響を軽減できる」という記述は誤りです。</p>
