      <h1>No. 13 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 4 です。</strong></p>
<p>数値地形図データは、地物の位置と形状を示す座標データと、内容を示す属性データなどで構成されます。</p>
<p>測量の概覧、データ構造、品質などを体系的に記載するものは製品仕様書です。縮尺1/2,500の地形図は地図情報レベル2500に相当します。</p>
