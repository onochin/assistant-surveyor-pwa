      <h1>No. 3 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 4 です。</strong></p>
<p>a は度分秒を度へ直してからラジアンへ換算します。</p>
<p class="calculation">84°15′36″ = 84.26°<br>84.26 × 3.14 ÷ 180 ≒ 1.47 rad</p>
<p>b は ∠A = 180° - 70° - 30° = 80° とし、正弦定理を使います。</p>
<p class="calculation">BC ÷ sin 80° = 8.0 ÷ sin 30°<br>BC ≒ 15.8 m</p>
