      <h1>No. 7 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 5 です。</strong></p>
<p>正反観測では、望遠鏡を反転することで視準線誤差や水平軸誤差などを軽減できます。</p>
<p>一方、鉛直軸そのものが鉛直線から傾いている場合、正反を平均しても影響は消えません。整準を適切に行う必要があります。</p>
