      <h1>No. 14 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 3 です。</strong></p>
<p>等高線の間隔は斜面の傾斜を表します。緩やかな斜面では等高線の間隔が広くなり、急な斜面では狭くなります。</p>
<p>選択肢3は広い・狭いの関係が逆です。</p>
