      <h1>No. 23 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 1 です。</strong></p>
        <p>
          地形図では、表示事項が重なる場合に必要最小限の転位を行います。
          真位置に描画すべき一般的な優先順位は、三角点、海岸線、道路、建物、植生の順です。
        </p>

        <h3>優先順位</h3>
        <p class="calculation">
          三角点 → 海岸線 → 道路 → 建物 → 植生
        </p>
