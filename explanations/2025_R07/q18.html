      <h1>No. 18 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 1（近赤外 / 緑色 / 水質）です。</strong></p>
        <p>
          近赤外レーザは水面で反射しやすく、緑色レーザは水を透過して水底で反射しやすい
          特性があります。緑色レーザによる測深は水質の影響を受けます。
        </p>

        <h3>空欄の確認</h3>
        <dl>
          <dt>［ア］近赤外</dt>
          <dd>水面で反射しやすい波長域です。</dd>
          <dt>［イ］緑色</dt>
          <dd>水中を透過し、水底で反射しやすい波長域です。</dd>
          <dt>［ウ］水質</dt>
          <dd>透明度、濁度、透視度、浮遊物質量などを調査します。</dd>
        </dl>
