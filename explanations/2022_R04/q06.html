      <h1>No. 6 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 2 です。</strong></p>
<p>1級・2級基準点測量では、選点時に選点図と平均図を作成します。TS観測は原則として結合多角方式で行います。</p>
<p>平均計算では厳密水平網平均計算等を実施し、結果を精度管理表に取りまとめます。</p>
