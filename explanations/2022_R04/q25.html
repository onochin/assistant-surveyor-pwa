      <h1>No. 25 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 5 です。</strong></p>
<p>現道路の接線長BC〜IPから、新道路の曲線半径を求めます。</p>
<p class="calculation">BC〜IP = 420 tan 45° = 420 m<br>
新道路の半径 = 420 ÷ tan 30° ≒ 727.5 m<br>
曲線長 = 727.5 × 3.14 × 60 ÷ 180 ≒ 761 m</p>
