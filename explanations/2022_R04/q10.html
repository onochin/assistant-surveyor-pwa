      <h1>No. 10 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 2 です。</strong></p>
<p>標尺は2本1組で使用します。往路と復路では、出発点に立てる標尺を交換して零点誤差等の影響を軽減します。</p>
<p>往路と復路で同じ標尺を出発点に立てるとする選択肢2が誤りです。</p>
