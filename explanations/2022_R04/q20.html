      <h1>No. 20 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 3（b、d） です。</strong></p>
<dl><dt>b. 誤り</dt><dd>中心投影像では、高い地物は写真中心から外側へ倒れ込むように写ります。</dd>
<dt>d. 誤り</dt><dd>他の条件が同じなら、対地高度が下がるほど地上画素寸法は小さくなります。</dd>
<dt>a、c、e. 正しい</dt><dd>空中写真測量の特徴として適切です。</dd></dl>
