      <h1>No. 15 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 4 です。</strong></p>
<p>角度誤差1′40″は100″です。弧長近似で水平位置誤差を求めます。</p>
<p class="calculation">120 m × 100″ ÷ (2 × 10<sup>5</sup>″) = 0.060 m = 60 mm</p>
