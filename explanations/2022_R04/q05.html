      <h1>No. 5 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 1 です。</strong></p>
<p>外周路線に属する新点の選点では、隣接既知点を結ぶ直線から外側40°以上ではなく、内側に選ぶなど、網の形状を適切に保つ必要があります。</p>
<p>未知点数が多いほど精度が低下すること、正反観測や点検路線で誤差を管理することは適切です。</p>
