      <h1>No. 11 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 4 です。</strong></p>
<p>標尺2本を1組とし測点数を偶数にすると零点誤差を軽減できます。前後視距離を等しくすると視準線誤差を軽減できます。</p>
<p>地球表面の湾曲による誤差は球差です。屈折の影響は視準距離を短くして抑え、往復観測値の較差の許容範囲は距離の平方根に比例します。</p>
