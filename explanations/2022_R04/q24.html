      <h1>No. 24 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 5 です。</strong></p>
<p>各地形分類と災害リスクを対応させます。</p>
<dl><dt>ア: d</dt><dd>扇状地は山地からの出水や土石流に注意します。</dd>
<dt>イ: a</dt><dd>自然堤防は洪水に比較的強い一方、大規模洪水や縁辺部の液状化に注意します。</dd>
<dt>ウ: b</dt><dd>旧河道・浅い谷は雨水が集まりやすく、浸水や液状化に注意します。</dd>
<dt>エ: c</dt><dd>氾濫平野は河川氾濫、軟弱地盤、液状化、沿岸部の高潮に注意します。</dd></dl>
