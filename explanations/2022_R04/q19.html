      <h1>No. 19 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 5 です。</strong></p>
<p>空中写真測量では、標定点の設置、撮影、同時調整、数値図化の順に作業を進めます。</p>
<p>図19のア〜エには、この順序に対応する語句が入ります。</p>
