      <h1>No. 2 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 5（c、e） です。</strong></p>
<dl><dt>c. 誤り</dt><dd>私有地へ立ち入る場合は、測量計画機関が発行した身分証明書を携帯します。カラーコピーでは足りません。</dd>
<dt>e. 誤り</dt><dd>貸与データを格納したUSBメモリを紛失した場合、作業への影響の有無にかかわらず、速やかに報告して指示を受けます。</dd>
<dt>a、b、d. 正しい</dt><dd>事故報告、安全管理、所有者の承諾を得た伐採として適切です。</dd></dl>
