      <p class="eyebrow">令和4年 測量士補</p>
      <h1>No. 1 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 1（a、c） です。</strong></p>
<dl><dt>a. 誤り</dt><dd>測量法の「測量」には、土地の測量だけでなく、地図の調製と測量用写真の撮影も含まれます。</dd>
<dt>c. 誤り</dt><dd>基本測量は国土地理院の行う測量ですが、測量業者が作業を請け負うことまで禁止していません。</dd>
<dt>b、d、e. 正しい</dt><dd>公共測量の計画書、測量士・測量士補の役割、測量標の移転制限として適切です。</dd></dl>
