      <h1>No. 28 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 5（d、e） です。</strong></p>
<dl><dt>d. 誤り</dt><dd>水準基標は水位標に近接した位置に設置します。離れた位置に設置するという記述が誤りです。</dd>
<dt>e. 誤り</dt><dd>深浅測量では、水底部の地形を明らかにするため横断面図データファイルを作成します。縦断面図とする記述が誤りです。</dd>
<dt>a、b、c. 正しい</dt><dd>河川測量、距離標、水準基標測量についての記述として適切です。</dd></dl>
