      <h1>No. 27 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 4 です。</strong></p>
<p>方向角と平面距離から各点の座標を求め、座標法で三角形の面積を計算します。</p>
<p class="calculation">A = (50 cos 45°, 50 sin 45°)<br>
B = (20 cos 90°, 20 sin 90°)<br>
C = (50 cos 330°, 50 sin 330°)<br>
座標法による面積 ≒ 1,128 m²</p>
