      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 5 です。</strong></p>
<p>偏心距離による方向補正量を求めます。</p>
<p class="calculation">補正量 = (e ÷ S) sin Φ × 2 × 10<sup>5</sup>″<br>
= (2.70 ÷ 1,500) × sin 210° × 200,000″ = -180″ = -3′</p>
<p class="calculation">T = 50°41′00″ - 3′00″ = 50°38′00″</p>
