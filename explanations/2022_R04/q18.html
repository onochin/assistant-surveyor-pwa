      <h1>No. 18 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 4 です。</strong></p>
<p>UAV写真測量では、計画対地高度に対する実際の飛行高度のずれは、所定の範囲内に抑える必要があります。</p>
<p>30%以内とする選択肢4は許容範囲が大きすぎるため誤りです。</p>
