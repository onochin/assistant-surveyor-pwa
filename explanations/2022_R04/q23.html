      <h1>No. 23 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 2 です。</strong></p>
<p>地図編集で転位が必要な場合、位置の基準として重要な対象を優先します。</p>
<p>河川と市町村界が近接する場合は、河川ではなく市町村界を転位します。選択肢2が誤りです。</p>
