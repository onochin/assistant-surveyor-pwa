      <h1>No. 8 解説</h1>

      <section class="explanation-card">
        <h2>解説</h2>
        <p><strong>正解は 5 です。</strong></p>
<p>搬送波位相を用いて2点間の相対位置を決める方法は干渉測位です。</p>
<p>一重位相差で衛星時計誤差、二重位相差で受信機時計誤差も消去し、基線解析で基線ベクトルを求めます。電子基準点のみを既知点とする場合は、セミ・ダイナミック補正を行います。</p>
