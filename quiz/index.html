<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f4ee">
    <title>測量士補 過去問</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="quiz-home-nav">
      <a href="../">ホームへ戻る</a>
    </nav>
    <header class="site-header">
      <div>
        <p id="exam-label" class="eyebrow">令和7年</p>
        <h1>測量士補 過去問</h1>
        <label class="exam-selector">
          年度
          <select id="exam-select">
            <option value="2025_R07">令和7年</option>
            <option value="2024_R06">令和6年</option>
            <option value="2022_R04">令和4年</option>
            <option value="GNSS_FOCUS">GNSS測位</option>
          </select>
        </label>
      </div>
      <button id="open-function-table" class="secondary-button" type="button">関数表</button>
    </header>

    <main>
      <section class="progress-panel" aria-label="進捗">
        <div class="progress-label">
          <span id="question-position">No. 1 / 28</span>
          <span id="score-summary">回答 0 / 28</span>
        </div>
        <div class="progress-track"><span id="progress-bar"></span></div>
      </section>

      <section id="category-filter-panel" class="category-filter-panel" hidden>
        <div class="filter-section">
          <h2>表示</h2>
          <div id="archive-filters" class="category-filters"></div>
        </div>
        <div id="category-filter-section" class="filter-section">
          <h2>カテゴリ</h2>
          <div id="category-filters" class="category-filters"></div>
        </div>
      </section>

      <section id="question-card" class="question-card" aria-live="polite">
        <h2 id="question-title">読み込み中...</h2>
        <p id="question-prompt" class="question-prompt"></p>
        <div id="question-assets" class="asset-list"></div>
        <fieldset id="choices" class="choices">
          <legend class="visually-hidden">選択肢</legend>
        </fieldset>
        <p id="answer-result" class="answer-result" role="status"></p>
        <a id="explanation-link" class="explanation-link" target="_blank" rel="noopener">
          解説を見る
        </a>
        <div class="archive-panel">
          <p id="archive-status">通常表示中</p>
          <button id="toggle-archive" class="secondary-button" type="button">覚えたのでアーカイブ</button>
        </div>
        <section class="note-panel" aria-labelledby="note-title">
          <div class="note-header">
            <h3 id="note-title">メモ</h3>
            <span id="note-save-status">端末内に自動保存</span>
          </div>
          <textarea id="question-note" rows="5" placeholder="間違えた理由や覚えておきたい点を記入"></textarea>
          <div class="note-actions">
            <button id="clear-question-note" class="secondary-button" type="button">このメモを削除</button>
            <button id="open-notes" class="secondary-button" type="button">メモ一覧・バックアップ</button>
          </div>
        </section>
      </section>

      <nav class="question-controls" aria-label="問題の移動">
        <button id="previous-question" class="secondary-button" type="button">前の問題</button>
        <button id="show-question-list" class="secondary-button" type="button">問題一覧</button>
        <button id="next-question" class="primary-button" type="button">次の問題</button>
      </nav>
    </main>

    <dialog id="question-list-dialog">
      <div class="dialog-header">
        <h2>問題一覧</h2>
        <button class="icon-button" data-close-dialog type="button" aria-label="閉じる">×</button>
      </div>
      <div id="question-list" class="question-grid"></div>
      <button id="reset-progress" class="danger-button" type="button">回答履歴をリセット</button>
    </dialog>

    <dialog id="function-table-dialog">
      <div class="dialog-header">
        <h2>巻末関数表</h2>
        <button class="icon-button" data-close-dialog type="button" aria-label="閉じる">×</button>
      </div>
      <div id="function-table-assets" class="asset-list"></div>
    </dialog>

    <dialog id="notes-dialog">
      <div class="dialog-header">
        <h2>メモ一覧・バックアップ</h2>
        <button class="icon-button" data-close-dialog type="button" aria-label="閉じる">×</button>
      </div>
      <p id="notes-summary"></p>
      <div class="backup-actions">
        <button id="export-study-data" class="secondary-button" type="button">JSONを書き出す</button>
        <label class="secondary-button file-button">
          JSONを読み込む
          <input id="import-study-data" type="file" accept="application/json,.json">
        </label>
      </div>
      <p class="dialog-help">
        JSONには全問題集の回答履歴とメモを保存します。読み込み時は現在のデータへ統合し、
        同じ問題のデータだけ上書きします。
      </p>
      <div id="notes-list" class="notes-list"></div>
    </dialog>

    <template id="asset-template">
      <a class="asset-link" target="_blank" rel="noopener">
        <img loading="lazy" alt="">
        <span>画像を拡大表示</span>
      </a>
    </template>

    <script src="../register-sw.js"></script>
    <script src="app.js"></script>
  </body>
</html>
